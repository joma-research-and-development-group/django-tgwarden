[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-tgwarden"
version = "0.1.0"
description = "A production-grade Django logging handler that ships log records to a Telegram supergroup."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "joma-research-and-development-group" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Logging",
]
dependencies = [
    "django>=4.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
celery = ["celery>=5.3"]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "build>=1.2",
    "pre-commit>=3.7",
    "django-stubs>=5.0",
    "celery>=5.3",
]

[project.urls]
Homepage = "https://github.com/joma-research-and-development-group/django-tgwarden"
Repository = "https://github.com/joma-research-and-development-group/django-tgwarden"
Issues = "https://github.com/joma-research-and-development-group/django-tgwarden/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tgwarden"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["src/tgwarden"]
exclude = ["tests"]
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
addopts = "-ra -q --cov=tgwarden --cov-report=term-missing"
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["tgwarden"]

[tool.coverage.report]
fail_under = 85
